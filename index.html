<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>StarsZeus</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1016);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-secondary-bg-color, #1b1d27));
    --text: var(--tg-theme-text-color, #f3f3f7);
    --hint: var(--tg-theme-hint-color, #8b8d9c);
    --link: var(--tg-theme-link-color, #6ab3f3);
    --btn: var(--tg-theme-button-color, #2f8cf0);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --soft: color-mix(in srgb, var(--text) 7%, transparent);
    --gold: #ffa53a;
    --violet: #7b6cff;
    --bad: #ff453a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif;
    padding: 10px 12px calc(76px + env(safe-area-inset-bottom));
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  .hidden { display: none !important; }
  body.tg { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }

  /* шапка */
  .top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .logo {
    width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 15px;
    background: linear-gradient(135deg, #ffd66b, #ff9f2e); color: #3a2300;
  }
  .top h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.2px; flex: 1; }
  .pill { font-size: 11.5px; color: var(--hint); background: var(--soft); padding: 4px 8px; border-radius: 999px; }

  /* переключатели */
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px;
         padding: 3px; border-radius: 11px; background: var(--card); }
  .seg button { padding: 8px 6px; border-radius: 9px; font-weight: 600; color: var(--hint); }
  .seg button.active { background: var(--soft); color: var(--text); }
  .tabs { margin-bottom: 10px; }
  .tabs button { padding: 9px 6px; font-size: 14.5px; }

  .block { margin-bottom: 8px; }
  .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--hint); margin: 0 2px 5px; }

  /* получатель */
  .to { display: flex; gap: 6px; align-items: stretch; }
  .to .seg { flex: none; width: 150px; }
  .to .seg button.active { color: var(--btn); background: color-mix(in srgb, var(--btn) 16%, transparent); }
  .field {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px;
    padding: 0 10px; border-radius: 11px; background: var(--card); border: 1.5px solid transparent;
  }
  .field.err { border-color: var(--bad); }
  .field span { color: var(--hint); font-weight: 600; }
  .field input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 16px; padding: 8px 0;
  }
  .self { flex: 1; min-width: 0; display: flex; align-items: center; padding: 0 10px;
          border-radius: 11px; background: var(--card); font-weight: 600; overflow: hidden;
          white-space: nowrap; text-overflow: ellipsis; }
  .self.empty { color: var(--hint); font-weight: 400; font-size: 12.5px; white-space: normal; line-height: 1.25; padding: 5px 10px; }
  .msg { font-size: 12px; color: var(--hint); margin: 4px 2px 0; min-height: 15px; }
  .msg.err { color: var(--bad); }

  /* звёзды */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .chip {
    padding: 7px 4px 6px; border-radius: 11px; background: var(--card); text-align: center;
    border: 1.5px solid transparent;
  }
  .chip b { display: block; font-size: 14.5px; font-weight: 750; }
  .chip small { display: block; font-size: 11px; color: var(--hint); margin-top: 1px; white-space: nowrap; }
  .chip.active { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 13%, var(--card)); }
  .custom { margin-top: 6px; display: flex; }
  .custom .field { padding: 0 10px; }

  /* premium */
  .plans { display: grid; gap: 6px; }
  .plan {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px;
    background: var(--card); border: 1.5px solid transparent; text-align: left; position: relative;
  }
  .plan.active { border-color: var(--violet); background: color-mix(in srgb, var(--violet) 13%, var(--card)); }
  .gem { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-size: 16px;
         background: linear-gradient(135deg, #b388ff, #6c5cff); flex: none; }
  .plan .t { flex: 1; }
  .plan .t b { display: block; font-size: 14.5px; }
  .plan .t small { color: var(--hint); font-size: 12px; }
  .plan .p { font-weight: 750; white-space: nowrap; }
  .tag { position: absolute; top: -7px; right: 10px; font-size: 10px; font-weight: 700; padding: 2px 6px;
         border-radius: 999px; background: linear-gradient(135deg, #ffd66b, #ff9f2e); color: #3a2300; }

  /* оплата */
  .pay { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .pm { padding: 8px 4px; border-radius: 11px; background: var(--card); border: 1.5px solid transparent;
        text-align: center; font-weight: 600; font-size: 13px; }
  .pm i { display: block; font-style: normal; font-size: 17px; margin-bottom: 2px; }
  .pm.active { border-color: var(--btn); background: color-mix(in srgb, var(--btn) 13%, var(--card)); }

  /* итог */
  .total { display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
           padding: 10px 12px; border-radius: 12px; background: var(--card); }
  .total span { color: var(--hint); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .total b { font-size: 18px; white-space: nowrap; }
  .club { font-size: 12px; color: var(--gold); margin: 5px 2px 0; }
  .foot { font-size: 11.5px; color: var(--hint); text-align: center; margin-top: 8px; }
  .foot a { color: var(--link); text-decoration: none; }

  .fallback-pay {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
    padding: 13px; border-radius: 12px; font-weight: 700; font-size: 15px;
    background: var(--btn); color: var(--btn-text); display: none;
  }
  .fallback-pay:disabled { opacity: .5; }
</style>
</head>
<body>
  <div class="top">
    <span class="logo">⚡</span>
    <h1>StarsZeus</h1>
    <span class="pill">⚡ выдача 1–3 мин</span>
  </div>

  <div class="seg tabs">
    <button data-tab="stars" class="active">⭐ Звёзды</button>
    <button data-tab="tgpremium">💎 Premium</button>
  </div>

  <div class="block">
    <div class="label">Кому</div>
    <div class="to">
      <div class="seg">
        <button id="to-self" class="active">Себе</button>
        <button id="to-friend">Другу</button>
      </div>
      <div class="self" id="self-box"></div>
      <label class="field hidden" id="friend-wrap">
        <span>@</span>
        <input id="friend" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
               maxlength="32" placeholder="username">
      </label>
    </div>
    <div class="msg" id="recipient-msg"></div>
  </div>

  <div class="block" id="stars-sec">
    <div class="label">Сколько звёзд</div>
    <div class="grid" id="presets"></div>
    <div class="custom">
      <label class="field" id="qty-wrap">
        <span>⭐</span>
        <input id="qty" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Своё количество">
      </label>
    </div>
    <div class="msg" id="qty-msg"></div>
  </div>

  <div class="block hidden" id="prem-sec">
    <div class="label">Срок</div>
    <div class="plans" id="plans"></div>
  </div>

  <div class="block">
    <div class="label">Оплата</div>
    <div class="pay" id="methods"></div>
  </div>

  <div class="total"><span id="sum-item">—</span><b id="sum-total">—</b></div>
  <div class="club hidden" id="club-note"></div>
  <div class="foot">Счёт придёт в чат с ботом · <a id="sup-link" href="#">поддержка</a></div>

  <button class="fallback-pay" id="fallback-pay">Оплатить</button>

<script>
(function () {
  "use strict";
  var tg = window.Telegram && window.Telegram.WebApp;
  var inTelegram = !!(tg && tg.initData);
  var qs = new URLSearchParams(location.search);
  var $ = function (id) { return document.getElementById(id); };

  function num(key, def) { var v = parseFloat(qs.get(key)); return isFinite(v) && v > 0 ? v : def; }

  // Цены приходят от бота в ссылке. Итоговую сумму бот всё равно пересчитывает сам.
  var P = {
    star: num("s", 1.75),
    starBase: num("b", num("s", 1.75)),
    min: Math.max(1, Math.round(num("min", 50))),
    prem: { 3: num("p3", 0), 6: num("p6", 0), 12: num("p12", 0) },
    club: qs.get("c") === "1",
    crypto: qs.get("cr") === "1",
    ton: qs.get("ton") !== "0",
    support: (qs.get("sup") || "").replace(/^@/, ""),
    bot: (qs.get("bot") || "").replace(/^@/, "")
  };
  var MAX_STARS = 1000000;
  var tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  var selfName = ((tgUser && tgUser.username) || qs.get("u") || "").replace(/^@+/, "");
  var USER_RE = /^[A-Za-z][A-Za-z0-9_]{3,31}$/;

  var state = { kind: "stars", toSelf: !!selfName, friend: "", qty: 500, customQty: "",
                months: 12, method: "lava" };
  var touched = { r: false, q: false };

  function rub(v) {
    var opts = Math.abs(v - Math.round(v)) < 0.005 ? { maximumFractionDigits: 0 }
                                                   : { minimumFractionDigits: 2, maximumFractionDigits: 2 };
    return v.toLocaleString("ru-RU", opts) + " ₽";
  }
  function rub2(v) { return v.toLocaleString("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₽"; }
  function fmt(v) { return v.toLocaleString("ru-RU"); }
  function short(q) { return q >= 1000 ? (q / 1000).toLocaleString("ru-RU") + "K" : String(q); }
  function haptic(k) {
    try {
      if (!inTelegram || !tg.HapticFeedback) return;
      if (k === "sel") tg.HapticFeedback.selectionChanged();
      else if (k === "err") tg.HapticFeedback.notificationOccurred("error");
      else tg.HapticFeedback.impactOccurred("light");
    } catch (e) {}
  }

  // ── построение (один раз) ──────────────────────────────────────────────
  var PRESETS = [50, 100, 250, 500, 1000, 2500, 5000, 10000].filter(function (q) { return q >= P.min; });
  PRESETS.forEach(function (q) {
    var b = document.createElement("button");
    b.className = "chip"; b.dataset.q = q;
    b.innerHTML = "<b>" + short(q) + "</b><small>" + rub(q * P.star) + "</small>";
    b.onclick = function () { state.qty = q; state.customQty = ""; $("qty").value = ""; haptic("sel"); update(); };
    $("presets").appendChild(b);
  });

  [[3, "3 месяца"], [6, "6 месяцев"], [12, "12 месяцев"]].forEach(function (x) {
    var m = x[0], price = P.prem[m];
    var b = document.createElement("button");
    b.className = "plan"; b.dataset.m = m;
    b.innerHTML = (m === 12 ? '<span class="tag">выгоднее</span>' : "") +
      '<span class="gem">💎</span><span class="t"><b>' + x[1] + '</b><small>' +
      (price ? rub(price / m) + " в месяц" : "цена уточняется") + '</small></span>' +
      '<span class="p">' + (price ? rub2(price) : "—") + '</span>';
    b.onclick = function () { state.months = m; haptic("sel"); update(); };
    $("plans").appendChild(b);
  });

  var METHODS = [["lava", "💳", "Карта/СБП"]];
  if (P.ton) METHODS.push(["ton", "💠", "TON"]);
  if (P.crypto) METHODS.push(["crypto", "🪙", "Крипта"]);
  METHODS.forEach(function (x) {
    var b = document.createElement("button");
    b.className = "pm"; b.dataset.m = x[0];
    b.innerHTML = "<i>" + x[1] + "</i>" + x[2];
    b.onclick = function () { state.method = x[0]; haptic("sel"); update(); };
    $("methods").appendChild(b);
  });

  // ── расчёт ─────────────────────────────────────────────────────────────
  function qty() {
    if (state.kind === "tgpremium") return state.months;
    return state.customQty !== "" ? (parseInt(state.customQty, 10) || 0) : state.qty;
  }
  function price() {
    if (state.kind === "tgpremium") return P.prem[state.months] || 0;
    return Math.round(qty() * P.star * 100) / 100;
  }
  function recipient() { return state.toSelf ? selfName : state.friend.replace(/^@+/, "").trim(); }
  function errors() {
    var e = {}, r = recipient();
    if (!r) e.r = state.toSelf ? "" : "Введи @username получателя";
    else if (!USER_RE.test(r)) e.r = "Username: 4–32 символа, латиница, цифры и _";
    if (state.kind === "stars") {
      var q = qty();
      if (q < P.min) e.q = "Минимум " + fmt(P.min) + " звёзд";
      else if (q > MAX_STARS) e.q = "Максимум " + fmt(MAX_STARS) + " звёзд";
    } else if (!P.prem[state.months]) e.q = "Цена Premium сейчас недоступна";
    return e;
  }

  function setActive(boxId, attr, value) {
    Array.prototype.forEach.call($(boxId).children, function (b) {
      b.classList.toggle("active", String(b.dataset[attr]) === String(value));
    });
  }

  function update() {
    var stars = state.kind === "stars";
    document.querySelectorAll(".tabs button").forEach(function (t) {
      t.classList.toggle("active", t.dataset.tab === state.kind);
    });
    $("stars-sec").classList.toggle("hidden", !stars);
    $("prem-sec").classList.toggle("hidden", stars);

    $("to-self").classList.toggle("active", state.toSelf);
    $("to-friend").classList.toggle("active", !state.toSelf);
    $("self-box").classList.toggle("hidden", !state.toSelf);
    $("friend-wrap").classList.toggle("hidden", state.toSelf);
    var sb = $("self-box");
    sb.classList.toggle("empty", !selfName);
    sb.textContent = selfName ? "@" + selfName
      : (inTelegram ? "Нет @username в Telegram — выбери «Другу»" : "Открой через бота или выбери «Другу»");

    Array.prototype.forEach.call($("presets").children, function (b) {
      b.classList.toggle("active", !state.customQty && state.qty === +b.dataset.q);
    });
    setActive("plans", "m", state.months);
    if (!METHODS.some(function (x) { return x[0] === state.method; })) state.method = METHODS[0][0];
    setActive("methods", "m", state.method);

    var e = errors();
    var showR = e.r && (touched.r || state.friend.length > 0);
    $("recipient-msg").textContent = showR ? e.r : "";
    $("recipient-msg").classList.toggle("err", !!showR);
    $("friend-wrap").classList.toggle("err", !!showR);
    var showQ = stars && e.q && (touched.q || state.customQty !== "");
    $("qty-msg").textContent = showQ ? e.q : "";
    $("qty-msg").classList.toggle("err", !!showQ);
    $("qty-wrap").classList.toggle("err", !!showQ);

    var p = price(), q = qty();
    var r = recipient();
    $("sum-item").textContent = (stars ? (q ? fmt(q) + " ⭐" : "—") : "Premium " + state.months + " мес") +
      (r ? " → @" + r : "");
    $("sum-total").textContent = p ? rub2(p) : "—";
    var cn = $("club-note");
    if (stars && P.club && P.starBase > P.star && q) {
      cn.textContent = "★ Скидка Club: −" + rub2((P.starBase - P.star) * q);
      cn.classList.remove("hidden");
    } else cn.classList.add("hidden");

    var ok = !Object.keys(e).length && p > 0;
    var label = ok ? "Оплатить · " + rub2(p) : "Оплатить";
    if (inTelegram) {
      tg.MainButton.setText(label);
      if (ok) {
        tg.MainButton.enable();
        tg.MainButton.setParams({ color: tg.themeParams.button_color || "#2f8cf0",
                                  text_color: tg.themeParams.button_text_color || "#ffffff" });
      } else {
        tg.MainButton.disable();
        tg.MainButton.setParams({ color: tg.themeParams.hint_color || "#8b8d9c" });
      }
      tg.MainButton.show();
    } else {
      var fb = $("fallback-pay");
      fb.textContent = label; fb.disabled = !ok; fb.style.display = "block";
    }
  }

  // ── отправка заказа в бота ─────────────────────────────────────────────
  // Заказ уходит ссылкой t.me/<бот>?start=o-<товар>-<кол-во>-<оплата>-<username>:
  // работает при любом способе открытия приложения. Бот сам проверяет данные и считает цену.
  function submit() {
    touched.r = true; touched.q = true;
    var e = errors();
    if (Object.keys(e).length || !price()) { haptic("err"); update(); return; }
    var code = "o-" + (state.kind === "stars" ? "s" : "p") + "-" + qty() + "-" +
               ({ lava: "l", ton: "t", crypto: "c" })[state.method] + "-" + recipient();
    haptic("tap");
    if (inTelegram && P.bot) {
      tg.MainButton.showProgress(false);
      tg.openTelegramLink("https://t.me/" + P.bot + "?start=" + code);
      setTimeout(function () { try { tg.close(); } catch (x) {} }, 400);
    } else if (inTelegram) {
      tg.sendData(JSON.stringify({ v: 1, k: state.kind, r: "@" + recipient(), q: qty(), m: state.method }));
    } else {
      alert("Предпросмотр вне Telegram.\nБоту уйдёт: /start " + code);
    }
  }

  // ── события ────────────────────────────────────────────────────────────
  document.querySelectorAll(".tabs button").forEach(function (t) {
    t.onclick = function () { if (state.kind !== t.dataset.tab) { state.kind = t.dataset.tab; haptic("sel"); update(); } };
  });
  $("to-self").onclick = function () { state.toSelf = true; haptic(selfName ? "sel" : "err"); update(); };
  $("to-friend").onclick = function () {
    state.toSelf = false; haptic("sel"); update();
    setTimeout(function () { $("friend").focus(); }, 50);
  };
  $("friend").addEventListener("input", function (ev) {
    var v = ev.target.value.replace(/^@+/, "").replace(/[^A-Za-z0-9_]/g, "");
    if (v !== ev.target.value) ev.target.value = v;
    state.friend = v; update();
  });
  $("friend").addEventListener("blur", function () { touched.r = true; update(); });
  $("qty").addEventListener("input", function (ev) {
    var v = ev.target.value.replace(/\D/g, "").slice(0, 7);
    if (v !== ev.target.value) ev.target.value = v;
    state.customQty = v; update();
  });
  $("qty").addEventListener("blur", function () { if (state.customQty !== "") touched.q = true; update(); });
  ["friend", "qty"].forEach(function (id) {
    $(id).addEventListener("keydown", function (ev) { if (ev.key === "Enter") ev.target.blur(); });
  });
  $("fallback-pay").onclick = submit;

  if (P.support) {
    $("sup-link").href = "https://t.me/" + P.support;
    $("sup-link").onclick = function (ev) {
      if (inTelegram) { ev.preventDefault(); tg.openTelegramLink("https://t.me/" + P.support); }
    };
  }
  if (inTelegram) {
    document.body.classList.add("tg");
    tg.ready(); tg.expand();
    try { tg.setHeaderColor("bg_color"); tg.setBackgroundColor("bg_color"); } catch (x) {}
    tg.MainButton.onClick(submit);
  }
  update();
})();
</script>
</body>
</html>
